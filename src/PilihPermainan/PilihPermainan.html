<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="PilihPermainan.css">
    <title>EcoQuest: Mission Earth</title>
</head>
<body>
    <div class="container">
        <!-- Tombol Game -->
        <div class="game-btn-wrapper">
            <img src="../../Asset/BersihkanSungai.jpg" 
                 id="btn-bersihkansungai" 
                 class="game-btn sungai" 
                 alt="Bersihkan Sungai" 
                 data-game="bersihkanSungai">
        </div>

        <div class="game-btn-wrapper">
            <img src="../../Asset/MenangkapSampah.jpg" 
                 id="btn-tangkapsampah" 
                 class="game-btn tangkapsampah" 
                 alt="Tangkap Sampah" 
                 data-game="tangkapSampah">
        </div>

        <div class="game-btn-wrapper">
            <img src="../../Asset/PilahSampah.jpg" 
                 id="btn-pilahsampah" 
                 class="game-btn pilahsampah" 
                 alt="Pilah Sampah" 
                 data-game="pilahSampah">
        </div>

        <!-- Tombol Navigasi -->
        <img src="../../Asset/TombolKembali.jpg" id="btn-kembali" class="kembali" alt="Kembali">
        <img src="../../Asset/VolumeAktif.jpg" id="btn-volume" class="volume" alt="VolumeAktif">
        <!-- <button id="btn-restart" class="restart">Reset Game</button> -->
    </div>

    <script src="PilihPermainan.js"></script>
</body>
</html>
